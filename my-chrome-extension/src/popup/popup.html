<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analizador de URL</title>
    <!-- Incluye Tailwind CSS para un estilo moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --background-color: #0d1117;
            --card-color: #161b22;
            --text-color: #ecf0f1;
            --accent-color: #00ff84; /* Verde neón */
            --glow-color: #00ff84;
            --secondary-text-color: #8b949e;
            --border-glow: rgba(0, 255, 132, 0.4);
        }

        body {
            font-family: 'Consolas', 'Menlo', monospace;
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--background-color);
            margin: 0;
            padding: 20px;
            min-width: 350px;
            min-height: 200px;
        }

        .container {
            background-color: var(--card-color);
            border: 1px solid var(--accent-color);
            border-radius: 12px;
            box-shadow: 0 0 15px var(--border-glow), 0 0 5px var(--accent-color);
            padding: 30px;
            width: 100%;
            max-width: 320px;
            text-align: center;
            transition: all 0.5s ease;
            position: relative;
            z-index: 20;
            box-sizing: border-box;
        }

        .container:hover {
            transform: scale(1.01);
            box-shadow: 0 0 25px var(--border-glow), 0 0 10px var(--accent-color);
        }

        h1 {
            font-size: 1.8em;
            font-weight: 700;
            color: var(--accent-color);
            text-shadow: 0 0 8px var(--glow-color);
            letter-spacing: 1px;
            margin-bottom: 15px;
            transition: color 0.3s;
        }

        p {
            color: var(--secondary-text-color);
            font-size: 0.95em;
            margin-bottom: 25px;
        }
        
        .button {
            display: block;
            background-color: var(--accent-color);
            color: var(--background-color);
            font-weight: bold;
            padding: 12px 28px;
            text-decoration: none;
            border-radius: 5px;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 255, 132, 0.6);
            border: none;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            font-family: 'Consolas', monospace;
        }

        .button:hover {
            background-color: #00b362;
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(0, 255, 132, 0.8);
        }
        
        .button:disabled {
            background: #444;
            color: #666;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Estilos para el indicador de carga */
        #loading-spinner {
            display: none;
            border: 4px solid rgba(0, 255, 132, 0.3);
            border-radius: 50%;
            border-top: 4px solid var(--accent-color);
            width: 40px;
            height: 40px;
            -webkit-animation: spin 1s linear infinite; /* Para Safari */
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @-webkit-keyframes spin {
            0% { -webkit-transform: rotate(0deg); }
            100% { -webkit-transform: rotate(360deg); }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Análisis de Contenido</h1>
        <div id="content-display" class="w-full text-center">
            <p class="text-gray-400">Analizando el sitio actual...</p>
        </div>

        <!-- Indicador de carga -->
        <div id="loading-spinner"></div>
        
        <button id="refresh-button" class="button">Volver a Analizar</button>
    </div>
    <script src="popup.js"></script>
</body>
</html>
