<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error 404 - Página No Encontrada</title>
    <style>
        :root {
            --background-color: #0d1117;
            --card-color: #161b22;
            --text-color: #ecf0f1;
            --accent-color: #00ff84; /* Verde neón */
            --glow-color: #00ff84;
            --secondary-text-color: #8b949e;
            --border-glow: rgba(0, 255, 132, 0.4);
        }

        body {
            font-family: 'Consolas', 'Menlo', monospace;
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--background-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column; /* Para centrar verticalmente */
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* --- Estilos del sistema de carga (Mantenidos, pero no activos por defecto en 404) --- */
        #loader-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--background-color);
            display: none; /* Oculto por defecto para la página 404 */
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .loader {
            width: 80px;
            height: 80px;
            border: 4px solid var(--card-color);
            border-top: 4px solid var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite, glow 1.5s infinite alternate;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes glow {
            0% { box-shadow: 0 0 5px var(--glow-color); }
            100% { box-shadow: 0 0 20px var(--glow-color); }
        }
        
        /* Contenido de la página (inicialmente invisible) */
        /* Para 404, el contenido debería ser visible por defecto */
        .content {
            opacity: 1; /* Siempre visible para 404 */
            transition: opacity 1s ease-in-out;
        }

        /* --- Animación de cubos en 3D --- */
        .cube-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            perspective: 800px;
            overflow: hidden;
            opacity: 0.1;
            pointer-events: none;
        }

        .cube-background::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 500%;
            height: 500%;
            background-image: radial-gradient(var(--accent-color) 1px, transparent 1px);
            background-size: 20px 20px;
            animation: cube-grid 30s linear infinite;
        }

        @keyframes cube-grid {
            from {
                transform: translate(-50%, -50%) rotateX(70deg) rotateZ(0deg) scale(0.5);
                opacity: 0;
            }
            to {
                transform: translate(-50%, -50%) rotateX(70deg) rotateZ(360deg) scale(1.5);
                opacity: 1;
            }
        }

        /* --- El resto de tus estilos --- */
        .container {
            max-width: 1100px;
            padding: 40px;
            text-align: center;
            position: relative;
            z-index: 10;
        }
        .background-effect {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(circle at 10% 20%, #0d1117, transparent 20%),
                        radial-gradient(circle at 90% 80%, #161b22, transparent 25%);
            animation: pulse-glow 15s infinite ease-in-out;
            z-index: -1;
        }

        @keyframes pulse-glow {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .card {
            background-color: var(--card-color);
            border: 1px solid var(--accent-color);
            border-radius: 12px;
            box-shadow: 0 0 15px var(--border-glow), 0 0 5px var(--accent-color);
            padding: 50px 70px;
            transition: all 0.5s ease;
            position: relative;
            z-index: 20;
            display: flex; /* Para organizar el contenido internamente */
            flex-direction: column;
            gap: 20px; /* Espacio entre elementos */
            align-items: center; /* Centrar contenido */
            max-width: 90%; /* Responsivo */
            box-sizing: border-box;
            text-align: center; /* Asegura el texto centrado dentro de la tarjeta */
        }
        
        .card:hover {
            transform: scale(1.02);
            box-shadow: 0 0 25px var(--border-glow), 0 0 10px var(--accent-color);
        }

        h1 {
            font-size: 3.5em;
            font-weight: 700;
            color: var(--accent-color);
            text-shadow: 0 0 8px var(--glow-color);
            letter-spacing: 2px;
            margin-bottom: 5px;
            transition: color 0.3s;
        }

        p { /* Estilo general para párrafos */
            font-size: 1.2em; /* Ajustado para el mensaje de error */
            color: var(--secondary-text-color);
            margin-top: 0;
            margin-bottom: 20px; /* Espacio debajo del párrafo */
        }
        .button {
            display: inline-block;
            background-color: var(--accent-color);
            color: var(--background-color);
            font-weight: bold;
            padding: 14px 30px;
            text-decoration: none;
            border-radius: 5px;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 255, 132, 0.6);
            border: none;
            animation: pulse-border 1.5s infinite;
            cursor: pointer;
        }

        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0 rgba(0, 255, 132, 0.6); }
            70% { box-shadow: 0 0 0 15px rgba(0, 255, 132, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 255, 132, 0); }
        }

        .button:hover {
            background-color: #00b362;
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(0, 255, 132, 0.8);
        }

        
    </style>
</head>
<body>
    <!-- El loader no es necesario para una página 404, pero se mantiene oculto si se reutiliza el CSS -->
    <div id="loader-container">
        <div class="loader"></div>
    </div>

    <!-- Contenido principal para el error 404 -->
    <div class="main-content content">
        <div class="cube-background"></div> <!-- Fondo de cubos 3D -->
        <div class="background-effect"></div> <!-- Efecto de brillo de fondo -->

        <div class="card">
            <h1>404</h1>
            <p class="subtitle">¡Ups! Parece que te has perdido en el ciberespacio.</p>
            <p>La página que buscas no existe o se ha movido.</p>
            <a href="{{ url_for('login') }}" class="button">Volver al Inicio</a>
        </div>
    </div>

    <script>
        
        window.addEventListener('load', function() {
            const loader = document.getElementById('loader-container');
            const content = document.querySelector('.main-content');
            
           
            if (loader && getComputedStyle(loader).display !== 'none') {
                loader.style.opacity = '0';
                loader.addEventListener('transitionend', () => loader.style.display = 'none');
            }
            content.style.opacity = '1';
        });
    </script>
</body>
</html>
